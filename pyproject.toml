[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modlens"
version = "0.1.0"
description = "Local-first modded game diagnostics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7,<7",
    "pydantic>=2.7,<3",
    "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-qt>=4.4,<5", "ruff>=0.5"]

[project.scripts]
modlens = "modlens.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
